<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TdmsViewer 分析报表</title>
  <script src="echarts.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #d2d2d7;
      --text: #1d1d1f;
      --muted: #86868b;
      --accent: #007aff;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    .report-header {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-shrink: 0;
    }

    .report-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .report-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .report-time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    #grid {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      padding-bottom: 4px;
    }

    .dashboard-row {
      display: grid;
      grid-template-columns: repeat(24, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
      width: 100%;
    }

    .widget {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px 14px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      align-self: start;
      width: 100%;
      min-width: 0;
    }

    .widget-kpi {
      min-height: 96px;
    }

    .widget-chart {
      height: auto;
    }

    .widget-table {
      min-height: 120px;
      max-height: 480px;
    }

    .widget-title {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--text);
    }

    .widget-body {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .widget-body.has-chart {
      overflow: visible;
      flex: 0 0 auto;
    }

    .chart-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      flex-shrink: 0;
    }

    .chart-host {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .kpi-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding: 4px 6px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 34px;
      font-weight: 600;
      line-height: 1;
      color: var(--accent);
    }

    .kpi-unit {
      font-size: 14px;
      color: var(--muted);
      margin-left: 4px;
      font-weight: 500;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      height: 100%;
      align-content: center;
    }

    .kpi-item {
      background: #f8f8fa;
      border-radius: 10px;
      padding: 10px 12px;
      border: 0.5px solid #ececf0;
    }

    .kpi-item-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .kpi-item-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .compare-table th,
    .compare-table td {
      border-bottom: 0.5px solid var(--border);
      padding: 10px 12px;
      text-align: left;
    }

    .compare-table th {
      color: var(--muted);
      font-weight: 600;
      background: #f8f8fa;
    }

    .compare-table tr:hover td {
      background: #f8f8fa;
    }

    .compare-scroll {
      overflow: auto;
      height: 100%;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--card);
      border: 0.5px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="report-header" id="header" style="display:none;">
      <div>
        <h1 class="report-title" id="title"></h1>
        <div class="report-meta" id="meta"></div>
      </div>
      <div class="report-time" id="time"></div>
    </div>
    <div id="grid"></div>
    <div class="empty-state" id="empty">请在「分析编排」中运行分析后查看报表</div>
  </div>

  <script>
    const initialReport = /*__REPORT_JSON__*/null;
    const chartInstances = new Map();

    function formatValue(value, format) {
      if (value == null || Number.isNaN(value)) return "—";
      if (format === "F1") return Number(value).toFixed(1);
      if (format === "F2") return Number(value).toFixed(2);
      if (format === "G4") return Number(value).toPrecision(4);
      return String(value);
    }

    function disposeCharts() {
      chartInstances.forEach(c => c.dispose());
      chartInstances.clear();
    }

    function macChartBase() {
      return {
        backgroundColor: "transparent",
        textStyle: { fontFamily: "Segoe UI, PingFang SC, Microsoft YaHei UI, sans-serif", color: "#1d1d1f" },
        grid: { left: 72, right: 20, top: 36, bottom: 52, containLabel: false },
        xAxis: {
          axisLine: { lineStyle: { color: "#d2d2d7" } },
          axisLabel: { color: "#86868b", fontSize: 11 },
          splitLine: { show: false }
        },
        yAxis: {
          axisLine: { show: false },
          axisLabel: { color: "#86868b", fontSize: 11 },
          splitLine: { lineStyle: { color: "#ececf0" } }
        },
        tooltip: {
          trigger: "axis",
          backgroundColor: "#ffffff",
          borderColor: "#d2d2d7",
          textStyle: { color: "#1d1d1f", fontSize: 12 }
        },
        toolbox: {
          right: 8,
          top: 0,
          itemSize: 14,
          feature: {
            restore: { title: "重置" },
            dataZoom: { title: { zoom: "框选缩放", back: "还原缩放" } }
          }
        }
      };
    }

    function calcLeftMargin(label) {
      const text = label || "";
      return Math.min(120, Math.max(72, text.length * 11 + 40));
    }

    function buildAxisNameStyle() {
      return { color: "#86868b", fontSize: 11, fontWeight: 500 };
    }

    function buildValueAxisZoom(mode) {
      const slider = {
        type: "slider",
        xAxisIndex: 0,
        height: 18,
        bottom: 6,
        borderColor: "#d2d2d7",
        fillerColor: "rgba(0,122,255,0.12)",
        handleStyle: { color: "#007aff" },
        textStyle: { color: "#86868b", fontSize: 10 }
      };

      if (mode === "both") {
        return [
          {
            type: "inside",
            xAxisIndex: 0,
            yAxisIndex: 0,
            filterMode: "none",
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false
          },
          slider
        ];
      }

      const zoom = [
        {
          type: "inside",
          xAxisIndex: 0,
          filterMode: "none",
          zoomOnMouseWheel: true,
          moveOnMouseMove: true,
          moveOnMouseWheel: false
        },
        slider
      ];

      if (mode === "y") {
        zoom.push({
          type: "inside",
          yAxisIndex: 0,
          filterMode: "none",
          zoomOnMouseWheel: true,
          moveOnMouseMove: false,
          moveOnMouseWheel: false
        });
      }

      return zoom;
    }

    function createChartFrame(container) {
      container.classList.add("has-chart");
      const frame = document.createElement("div");
      frame.className = "chart-frame";
      const host = document.createElement("div");
      host.className = "chart-host";
      frame.appendChild(host);
      container.appendChild(frame);
      return host;
    }

    function initChart(host, blockId) {
      const chart = echarts.init(host, null, { renderer: "canvas" });
      chartInstances.set(blockId, chart);
      return chart;
    }

    function scheduleChartResize() {
      requestAnimationFrame(() => chartInstances.forEach(c => c.resize()));
    }

    function renderKpiCard(container, payload) {
      const root = document.createElement("div");
      root.className = "kpi-card";
      root.innerHTML = `
        <div class="kpi-label">${payload.label || ""}</div>
        <div>
          <span class="kpi-value">${formatValue(payload.value, payload.format)}</span>
          <span class="kpi-unit">${payload.unit || ""}</span>
        </div>`;
      container.appendChild(root);
    }

    function renderKpiGroup(container, payload) {
      const root = document.createElement("div");
      root.className = "kpi-grid";
      (payload.items || []).forEach(item => {
        const el = document.createElement("div");
        el.className = "kpi-item";
        el.innerHTML = `
          <div class="kpi-item-label">${item.label}</div>
          <div class="kpi-item-value">${formatValue(item.value, item.format)}${item.unit ? " " + item.unit : ""}</div>`;
        root.appendChild(el);
      });
      container.appendChild(root);
    }

    function renderLineChart(container, blockId, payload) {
      const host = createChartFrame(container);
      host.id = "chart-" + blockId;
      const chart = initChart(host, blockId);
      const base = macChartBase();
      const yLabel = payload.yLabel || "";
      const xLabel = payload.xLabel || "";

      const option = {
        ...base,
        grid: {
          ...base.grid,
          left: calcLeftMargin(yLabel),
          bottom: xLabel ? 58 : 48
        },
        dataZoom: buildValueAxisZoom("both"),
        xAxis: {
          ...base.xAxis,
          name: xLabel,
          nameLocation: "middle",
          nameGap: 28,
          nameTextStyle: buildAxisNameStyle(),
          type: "value"
        },
        yAxis: {
          ...base.yAxis,
          name: yLabel,
          nameLocation: "middle",
          nameGap: 48,
          nameRotate: 90,
          nameTextStyle: buildAxisNameStyle(),
          type: "value",
          scale: true
        },
        series: [{
          type: "line",
          showSymbol: false,
          smooth: false,
          lineStyle: { width: 1.5, color: "#007aff" },
          areaStyle: { color: "rgba(0,122,255,0.06)" },
          data: (payload.x || []).map((x, i) => [x, (payload.y || [])[i]])
        }]
      };
      chart.setOption(option);
      scheduleChartResize();
    }

    function renderBarChart(container, blockId, payload) {
      const host = createChartFrame(container);
      host.id = "chart-" + blockId;
      const chart = initChart(host, blockId);
      const base = macChartBase();
      const yLabel = payload.yLabel || "";

      const option = {
        ...base,
        grid: {
          ...base.grid,
          left: calcLeftMargin(yLabel),
          bottom: 58
        },
        dataZoom: [
          ...buildValueAxisZoom("x"),
          {
            type: "inside",
            yAxisIndex: 0,
            filterMode: "none",
            zoomOnMouseWheel: true,
            moveOnMouseMove: false,
            moveOnMouseWheel: false
          }
        ],
        xAxis: {
          ...base.xAxis,
          type: "category",
          data: payload.categories || [],
          axisLabel: { rotate: 35, fontSize: 10, color: "#86868b" }
        },
        yAxis: {
          ...base.yAxis,
          name: yLabel,
          nameLocation: "middle",
          nameGap: 48,
          nameRotate: 90,
          nameTextStyle: buildAxisNameStyle(),
          type: "value",
          scale: true
        },
        series: [{
          type: "bar",
          data: payload.values || [],
          itemStyle: { color: "#007aff", borderRadius: [4, 4, 0, 0] },
          barMaxWidth: 28
        }]
      };
      chart.setOption(option);
      scheduleChartResize();
    }

    function renderHeatmap(container, blockId, payload) {
      const host = createChartFrame(container);
      host.id = "chart-" + blockId;
      const chart = initChart(host, blockId);
      const base = macChartBase();
      const values = (payload.data || []).map(d => d[2]);
      const maxVal = values.length ? Math.max(...values) : 1;

      const option = {
        ...base,
        grid: { left: 72, right: 88, top: 36, bottom: 58 },
        dataZoom: [
          { type: "inside", xAxisIndex: 0, yAxisIndex: 0, filterMode: "none" },
          { type: "slider", xAxisIndex: 0, height: 18, bottom: 6, borderColor: "#d2d2d7" },
          { type: "slider", yAxisIndex: 0, width: 18, right: 6, borderColor: "#d2d2d7" }
        ],
        xAxis: {
          type: "category",
          name: "时间 (s)",
          nameLocation: "middle",
          nameGap: 28,
          nameTextStyle: buildAxisNameStyle(),
          data: payload.timeLabels || [],
          splitArea: { show: true },
          axisLabel: { color: "#86868b", fontSize: 10, rotate: 30 }
        },
        yAxis: {
          type: "category",
          name: "频率 (Hz)",
          nameLocation: "middle",
          nameGap: 56,
          nameRotate: 90,
          nameTextStyle: buildAxisNameStyle(),
          data: payload.freqLabels || [],
          splitArea: { show: true },
          axisLabel: { color: "#86868b", fontSize: 10 }
        },
        visualMap: {
          min: 0,
          max: maxVal,
          calculable: true,
          orient: "vertical",
          right: 28,
          top: "center",
          itemWidth: 10,
          itemHeight: 80,
          textStyle: { color: "#86868b", fontSize: 10 },
          inRange: { color: ["#e8f4ff", "#66b3ff", "#007aff", "#004499"] }
        },
        series: [{
          type: "heatmap",
          data: payload.data || [],
          emphasis: { itemStyle: { shadowBlur: 6, shadowColor: "rgba(0,0,0,0.2)" } }
        }]
      };
      chart.setOption(option);
      scheduleChartResize();
    }

    function renderCompareTable(container, payload) {
      const scroll = document.createElement("div");
      scroll.className = "compare-scroll";
      const table = document.createElement("table");
      table.className = "compare-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      (payload.columns || []).forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      (payload.rows || []).forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = typeof cell === "number" ? formatValue(cell, "G4") : (cell ?? "—");
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      container.appendChild(scroll);
    }

    function normalizePlacement(placement) {
      return {
        blockId: placement.blockId ?? placement.BlockId ?? "",
        row: Number(placement.row ?? placement.Row ?? 0),
        col: Number(placement.col ?? placement.Col ?? 0),
        colSpan: Number(placement.colSpan ?? placement.ColSpan ?? 12),
        rowSpan: Number(placement.rowSpan ?? placement.RowSpan ?? 1),
        widgetType: placement.widgetType ?? placement.WidgetType ?? "Auto"
      };
    }

    function groupPlacementsByRow(placements) {
      const bands = new Map();
      placements.map(normalizePlacement).forEach(placement => {
        if (!bands.has(placement.row)) bands.set(placement.row, []);
        bands.get(placement.row).push(placement);
      });

      return [...bands.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([row, items]) => ({
          row,
          items: items.sort((a, b) => a.col - b.col)
        }));
    }

    function appendWidgetToRow(rowEl, placement, block) {
      const widget = renderWidget(placement, block);
      widget.style.gridColumn = `${placement.col + 1} / span ${placement.colSpan}`;
      rowEl.appendChild(widget);
    }

    function isChartWidgetType(widgetType) {
      return widgetType === "LineChart" || widgetType === "BarChart" || widgetType === "Heatmap";
    }

    function resolveWidgetType(placement, block) {
      return placement.widgetType || block.widgetType;
    }

    function renderWidget(placement, block) {
      const widget = document.createElement("section");
      const widgetType = resolveWidgetType(placement, block);

      widget.className = "widget";
      if (isChartWidgetType(widgetType)) widget.classList.add("widget-chart");
      else if (widgetType === "KpiCard" || widgetType === "KpiGroup") widget.classList.add("widget-kpi");
      else if (widgetType === "CompareTable") widget.classList.add("widget-table");

      const title = document.createElement("h3");
      title.className = "widget-title";
      title.textContent = block.title || placement.widgetType;
      widget.appendChild(title);

      const body = document.createElement("div");
      body.className = "widget-body";
      widget.appendChild(body);

      const payload = block.payload || {};

      if (widgetType === "KpiCard") renderKpiCard(body, payload);
      else if (widgetType === "KpiGroup") renderKpiGroup(body, payload);
      else if (widgetType === "LineChart") renderLineChart(body, block.blockId, payload);
      else if (widgetType === "BarChart") renderBarChart(body, block.blockId, payload);
      else if (widgetType === "Heatmap") renderHeatmap(body, block.blockId, payload);
      else if (widgetType === "CompareTable") renderCompareTable(body, payload);
      else if (block.widgetType === "KpiCard") renderKpiCard(body, payload);
      else if (block.widgetType === "KpiGroup") renderKpiGroup(body, payload);
      else if (block.widgetType === "LineChart") renderLineChart(body, block.blockId, payload);
      else if (block.widgetType === "BarChart") renderBarChart(body, block.blockId, payload);
      else if (block.widgetType === "Heatmap") renderHeatmap(body, block.blockId, payload);
      else if (block.widgetType === "CompareTable") renderCompareTable(body, payload);

      return widget;
    }

    function renderReport(report) {
      disposeCharts();

      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const header = document.getElementById("header");

      grid.innerHTML = "";

      if (!report || !report.blocks || report.blocks.length === 0) {
        header.style.display = "none";
        empty.style.display = "flex";
        grid.style.display = "none";
        return;
      }

      grid.style.display = "flex";
      empty.style.display = "none";
      header.style.display = "flex";

      const meta = report.meta || {};
      document.getElementById("title").textContent = meta.title || "分析报表";
      document.getElementById("meta").innerHTML = [
        meta.fileName ? `文件：${meta.fileName}` : "",
        meta.groupName && meta.channelName ? `通道：${meta.groupName} / ${meta.channelName}` : "",
        meta.sampleRateHz ? `采样率：${meta.sampleRateHz} Hz · ${meta.sampleCount?.toLocaleString?.() || meta.sampleCount} 点` : ""
      ].filter(Boolean).join("<br/>");
      document.getElementById("time").textContent = meta.generatedAt
        ? new Date(meta.generatedAt).toLocaleString()
        : "";

      const blockMap = new Map((report.blocks || []).map(b => [b.blockId, b]));
      const placements = (report.layout && report.layout.widgets) || [];

      if (placements.length > 0) {
        groupPlacementsByRow(placements).forEach(band => {
          const rowEl = document.createElement("div");
          rowEl.className = "dashboard-row";
          band.items.forEach(placement => {
            const block = blockMap.get(placement.blockId);
            if (!block) return;
            appendWidgetToRow(rowEl, placement, block);
          });
          if (rowEl.childElementCount > 0) grid.appendChild(rowEl);
        });
      } else {
        const fallbackBands = new Map();
        report.blocks.forEach((block, index) => {
          const row = Math.floor(index / 2);
          if (!fallbackBands.has(row)) fallbackBands.set(row, []);
          fallbackBands.get(row).push({ block, col: (index % 2) * 12 });
        });

        [...fallbackBands.entries()]
          .sort((a, b) => a[0] - b[0])
          .forEach(([, items]) => {
            const rowEl = document.createElement("div");
            rowEl.className = "dashboard-row";
            items.forEach(({ block, col }) => {
              appendWidgetToRow(rowEl, normalizePlacement({
                blockId: block.blockId,
                widgetType: block.widgetType,
                col,
                row: 0,
                colSpan: 12,
                rowSpan: 1
              }), block);
            });
            grid.appendChild(rowEl);
          });
      }

      scheduleChartResize();
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", event => {
        try {
          const report = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          renderReport(report);
        } catch (err) {
          console.error("Invalid report payload", err);
        }
      });
    }

    function notifyHostReady() {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage("ready");
      }
    }

    window.renderTdmsReport = renderReport;
    notifyHostReady();

    window.addEventListener("resize", () => {
      chartInstances.forEach(c => c.resize());
    });

    if (initialReport) {
      renderReport(initialReport);
    }
  </script>
</body>
</html>
